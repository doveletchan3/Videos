<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>播放歷史 - 影片串流媒體</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Header with Logo and Search -->
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <a href="index.html" class="brand-logo" title="返回首頁"></a>
        <div class="search-box-wrap">
          <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="請輸入影片、短劇、演職人員" autocomplete="off">
            <button type="submit" class="search-btn">搜索</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub Navigation Bar -->
  <nav class="sub-nav">
    <div class="container">
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="index.html?cat=電影">電影</a></li>
        <li><a href="index.html?cat=劇集">劇集</a></li>
        <li class="nav-right">
          <a href="history.html" class="nav-history-link" style="color: var(--primary-color); font-weight: bold;">播放歷史</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 class="admin-card-title" style="margin-bottom: 0;">🕒 您的播放歷史記錄</h2>
        <button onclick="clearAllHistory()" class="btn-danger">清空所有記錄</button>
      </div>
      <p class="admin-card-subtitle">播放進度保存在您的本地瀏覽器中，隨時可一鍵繼續播放。</p>

      <div id="historyListContainer">
        <!-- Rendered history table -->
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCommonHeader('history');
      renderHistory();
    });

    function renderHistory() {
      const container = document.getElementById('historyListContainer');
      const list = WatchHistory.getAll();

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 40px 20px;">
            <h3>暫無播放歷史記錄</h3>
            <p>您觀看過的影片和進度會自動記錄在此處，方便您隨時繼續收看。</p>
            <a href="index.html" class="btn-primary">去首頁逛逛</a>
          </div>
        `;
        return;
      }

      let html = `
        <table class="history-table">
          <thead>
            <tr>
              <th style="width: 80px;">海報</th>
              <th>影片名稱</th>
              <th>上次觀看集數</th>
              <th>播放進度</th>
              <th>觀看時間</th>
              <th style="width: 140px;">操作</th>
            </tr>
          </thead>
          <tbody>
      `;

      list.forEach(item => {
        const timeStr = `${formatTime(item.currentTime)} / ${formatTime(item.duration)}`;
        const dateStr = item.updatedAt ? new Date(item.updatedAt).toLocaleString() : '-';
        const posterUrl = item.poster || APP_CONFIG.DEFAULT_FALLBACK_POSTER;

        html += `
          <tr>
            <td>
              <img src="${posterUrl}" style="width: 50px; height: 70px; object-fit: cover; border-radius: 4px;" onerror="this.src=APP_CONFIG.DEFAULT_FALLBACK_POSTER">
            </td>
            <td>
              <strong>${item.title}</strong>
              <div style="font-size: 12px; color: #888;">${item.category || '劇集'} · ${item.sourceName || '線路'}</div>
            </td>
            <td><span style="background: #eef5fe; color: #2b85e4; padding: 2px 8px; border-radius: 4px; font-size: 13px;">${item.epName || '第1集'}</span></td>
            <td>${timeStr}</td>
            <td style="font-size: 13px; color: #777;">${dateStr}</td>
            <td>
              <a href="play.html?id=${encodeURIComponent(item.id)}&src=${item.sourceIndex}&ep=${item.epIndex}" class="btn-primary" style="padding: 4px 10px; font-size: 12px; margin-right: 6px;">繼續播放</a>
              <button onclick="removeHistory('${item.id}')" class="btn-secondary" style="padding: 4px 8px; font-size: 12px;">刪除</button>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function removeHistory(id) {
      WatchHistory.remove(id);
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('確定要清空所有的觀看歷史記錄嗎？')) {
        WatchHistory.clear();
        renderHistory();
      }
    }
  </script>
</body>
</html>
