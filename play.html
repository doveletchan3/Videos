<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>正在播放 - 影片串流媒體</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <!-- Hls.js for smooth .m3u8 streaming across all browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>

  <!-- Top Header with Logo and Search -->
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <a href="index.html" class="brand-logo" title="返回首頁"></a>
        <div class="search-box-wrap">
          <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="請輸入影片、短劇、演職人員" autocomplete="off">
            <button type="submit" class="search-btn">搜索</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub Navigation Bar -->
  <nav class="sub-nav">
    <div class="container">
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="index.html?cat=電影">電影</a></li>
        <li><a href="index.html?cat=劇集">劇集</a></li>
        <li class="nav-right">
          <a href="history.html" class="nav-history-link">播放歷史</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Play Area -->
  <main class="container">

    <!-- Video Player Container (16:9) -->
    <div class="player-wrapper">
      <video id="mainVideoPlayer" controls playsinline preload="metadata"></video>
      <div id="playerLoading" class="player-loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <div id="loadingText">視頻加載中，請稍候...</div>
      </div>
      <!-- Center Play Button Overlay -->
      <div id="centerPlayOverlay" class="center-play-overlay" onclick="startPlaybackFromCenterBtn()" title="點擊播放">
        <div class="center-play-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="center-play-text">點擊播放</div>
      </div>
    </div>

    <!-- Playback Details and Episode List -->
    <div class="play-detail-layout">
      
      <!-- Left Column: Title, Route Selection, Episodes -->
      <div class="play-left">
        <h1 id="videoTitle" class="video-heading">加載中...</h1>
        
        <div class="line-info-bar">
          <span class="line-info-title">線路選擇</span>
          <span id="lineCountStat" class="line-info-count"></span>
        </div>
        
        <p class="line-disclaimer">
          (線路利用網路爬蟲技術獲取，各線路的版本、清晰度、播放速度等存在差異請自行切換。建議避開晚上高峯時段。)
        </p>

        <!-- Current Playing Status Badge -->
        <div id="currentPlayStatus" style="margin-bottom: 14px; font-size: 13px; color: #555; background: #f0f7ff; padding: 6px 12px; border-radius: 4px; display: inline-block;">
          <span id="playStatusPrefix">當前已選分集：</span><strong id="playingEpLabel" style="color: var(--primary-color);">-</strong>
        </div>

        <!-- Sources and Episode Buttons Container -->
        <div id="sourcesContainer">
          <!-- Dynamically populated sources -->
        </div>
      </div>

      <!-- Right Column: Video Info Card matching Image 2 -->
      <div class="play-right">
        <div class="media-info-card">
          <div class="media-info-inner">
            <img id="detailPoster" class="media-info-poster" src="" alt="海報" referrerpolicy="no-referrer" onerror="this.src=APP_CONFIG.DEFAULT_FALLBACK_POSTER">
            <div class="media-info-text">
              <h2 id="detailTitle" class="media-info-title">-</h2>
              <div id="detailAlias" class="media-info-alias">-</div>
              <div class="media-meta-row"><strong>類型：</strong><span id="detailCategory">-</span></div>
              <div class="media-meta-row"><strong>年份：</strong><span id="detailYear">-</span></div>
              <div class="media-meta-row"><strong>地區：</strong><span id="detailRegion">-</span></div>
              <div class="media-meta-row"><strong>主演：</strong><span id="detailActors">-</span></div>
            </div>
          </div>
        </div>

        <div class="sidebar-box" style="margin-top: 16px;">
          <h4 style="font-size: 14px; margin-bottom: 8px;">快捷操作</h4>
          <div style="display: flex; gap: 8px; flex-direction: column;">
            <button onclick="copyShareLink()" class="btn-secondary" style="width: 100%; text-align: center;">🔗 複製本片播放連結</button>
            <a href="index.html" class="btn-outline" style="width: 100%; text-align: center;">🏠 返回視頻首頁</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentVideo = null;
    let currentSourceIdx = 0;
    let currentEpIdx = 0;
    let hls = null;
    const videoEl = document.getElementById('mainVideoPlayer');
    const loadingOverlay = document.getElementById('playerLoading');
    const loadingText = document.getElementById('loadingText');

    document.addEventListener('DOMContentLoaded', async () => {
      initCommonHeader('play');

      const videoId = getUrlParam('id');
      if (!videoId) {
        alert('未指定影片ID，將返回首頁');
        window.location.href = 'index.html';
        return;
      }

      const allVideos = await loadVideos();
      currentVideo = allVideos.find(v => String(v.id) === String(videoId));

      if (!currentVideo) {
        // Check if demo or fallback can be used
        if (videoId === '898899') {
          // Provide demo video
          currentVideo = {
            id: "898899",
            title: "愛你",
            poster: "https://img2.doubanio.com/view/photo/m_ratio_poster/public/p2918554091.jpg",
            category: "劇集",
            details: {
              alias: "愛你，是我做過最好的事,愛上你是我做過最好的事",
              year: "2025",
              region: "中國大陸",
              actors: "車亮逸/張凌赫,徐若晗,王宥鈞,唐九洲,黃燦燦"
            },
            sources: [
              {
                name: "線路1 (穩定秒播)",
                episodes: [
                  { name: "第1集", url: "https://play.xluuss.com/play/7e52BRqa/index.m3u8" },
                  { name: "第2集", url: "https://play.xluuss.com/play/negwR2Ze/index.m3u8" },
                  { name: "第3集", url: "https://play.xluuss.com/play/bo2YjNka/index.m3u8" },
                  { name: "第4集", url: "https://play.xluuss.com/play/rb231MGe/index.m3u8" },
                  { name: "第5集", url: "https://play.xluuss.com/play/rb231Mde/index.m3u8" },
                  { name: "第6集", url: "https://play.xluuss.com/play/rb2314Le/index.m3u8" },
                  { name: "第7集", url: "https://play.xluuss.com/play/vbm3x3qd/index.m3u8" },
                  { name: "第8集", url: "https://play.xluuss.com/play/negwrPje/index.m3u8" }
                ]
              },
              {
                name: "線路2 (備用極速)",
                episodes: [
                  { name: "第1集", url: "https://v.gsuus.com/play/Rb41Azgd/index.m3u8" },
                  { name: "第2集", url: "https://v.gsuus.com/play/dJ6ZvXDd/index.m3u8" },
                  { name: "第3集", url: "https://v.gsuus.com/play/xe7Z6O1b/index.m3u8" },
                  { name: "第4集", url: "https://v.gsuus.com/play/6dBRoVva/index.m3u8" }
                ]
              }
            ]
          };
        } else {
          alert('找不到該影片信息！');
          window.location.href = 'index.html';
          return;
        }
      }

      initPageInfo();
      renderSourcesAndEpisodes();

      // Check if user specified ep or source in query or history
      const paramSource = parseInt(getUrlParam('src') || '0', 10);
      const paramEp = parseInt(getUrlParam('ep') || '0', 10);
      const historyItem = WatchHistory.get(currentVideo.id);

      let targetSrc = isNaN(paramSource) ? 0 : paramSource;
      let targetEp = isNaN(paramEp) ? 0 : paramEp;
      let resumeTime = 0;

      if (!getUrlParam('ep') && historyItem) {
        targetSrc = historyItem.sourceIndex || 0;
        targetEp = historyItem.epIndex || 0;
        resumeTime = historyItem.currentTime || 0;
      }

      // Initial page entry: load episode and prepare player, but DO NOT autoplay video!
      playEpisode(targetSrc, targetEp, resumeTime, false);
      setupPlayerEvents();
    });

    function initPageInfo() {
      document.title = `${currentVideo.title} - 在線觀看`;
      document.getElementById('videoTitle').textContent = currentVideo.title;
      
      const count = currentVideo.sources ? currentVideo.sources.length : 0;
      document.getElementById('lineCountStat').textContent = `（共${count}條）`;

      // Set poster on video player
      if (currentVideo.poster) {
        videoEl.poster = currentVideo.poster;
      }

      // Details
      document.getElementById('detailTitle').textContent = currentVideo.title;
      document.getElementById('detailPoster').src = currentVideo.poster || APP_CONFIG.DEFAULT_FALLBACK_POSTER;
      
      const d = currentVideo.details || {};
      document.getElementById('detailAlias').textContent = d.alias || currentVideo.title;
      document.getElementById('detailYear').textContent = d.year || '未知';
      document.getElementById('detailRegion').textContent = d.region || '其他';
      document.getElementById('detailActors').textContent = d.actors || '其他';
    }

    function renderSourcesAndEpisodes() {
      const container = document.getElementById('sourcesContainer');
      container.innerHTML = '';

      if (!currentVideo.sources || currentVideo.sources.length === 0) {
        container.innerHTML = '<div style="color: #999; padding: 20px;">暫無可播放的線路，請在管理後臺重新配置</div>';
        return;
      }

      currentVideo.sources.forEach((source, sIdx) => {
        const sec = document.createElement('div');
        sec.className = 'source-section';
        sec.id = `source-sec-${sIdx}`;

        const header = document.createElement('div');
        header.className = 'source-header';
        header.innerHTML = `
          <div class="source-title">
            <span>${source.name || ('線路' + (sIdx + 1))}</span>
            <span class="source-tag">${source.episodes ? source.episodes.length : 0} 集</span>
          </div>
        `;
        sec.appendChild(header);

        const epGrid = document.createElement('div');
        epGrid.className = 'episode-grid';

        if (source.episodes && source.episodes.length > 0) {
          source.episodes.forEach((ep, eIdx) => {
            const btn = document.createElement('div');
            btn.className = 'episode-btn';
            btn.id = `ep-btn-${sIdx}-${eIdx}`;
            btn.textContent = ep.name || `第${eIdx + 1}集`;
            btn.title = ep.name;
            btn.onclick = () => playEpisode(sIdx, eIdx, 0, true);
            epGrid.appendChild(btn);
          });
        } else {
          epGrid.innerHTML = '<span style="color: #999; font-size: 12px;">該線路暫無集數</span>';
        }

        sec.appendChild(epGrid);
        container.appendChild(sec);
      });
    }

    function playEpisode(sIdx, eIdx, resumeTime = 0, autoPlay = true) {
      if (!currentVideo.sources || !currentVideo.sources[sIdx]) return;
      const source = currentVideo.sources[sIdx];
      if (!source.episodes || !source.episodes[eIdx]) return;

      currentSourceIdx = sIdx;
      currentEpIdx = eIdx;
      const ep = source.episodes[eIdx];

      // Update UI active buttons
      document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`ep-btn-${sIdx}-${eIdx}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const epLabel = `${source.name || ('線路' + (sIdx + 1))} - ${ep.name}`;
      document.getElementById('playingEpLabel').textContent = epLabel;

      const centerOverlay = document.getElementById('centerPlayOverlay');
      const prefixEl = document.getElementById('playStatusPrefix');

      if (autoPlay) {
        if (centerOverlay) centerOverlay.style.display = 'none';
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = `正在連接 ${epLabel}...`;
        if (prefixEl) prefixEl.textContent = '當前正在播放：';
      } else {
        loadingOverlay.style.display = 'none';
        if (centerOverlay) centerOverlay.style.display = 'flex';
        if (prefixEl) prefixEl.textContent = '當前已選分集：';
      }

      loadStreamUrl(ep.url, resumeTime, autoPlay);
    }

    function startPlaybackFromCenterBtn() {
      const centerOverlay = document.getElementById('centerPlayOverlay');
      if (centerOverlay) centerOverlay.style.display = 'none';
      const prefixEl = document.getElementById('playStatusPrefix');
      if (prefixEl) prefixEl.textContent = '當前正在播放：';
      videoEl.play().catch((err) => {
        console.warn('Play error:', err);
      });
    }

    function loadStreamUrl(streamUrl, resumeTime = 0, autoPlay = true) {
      if (!streamUrl) {
        showPlayerError('視頻連結爲空，請切換其他集數或線路');
        return;
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const isM3u8 = streamUrl.toLowerCase().includes('.m3u8');

      if (isM3u8 && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          manifestLoadingTimeOut: 12000,
          manifestLoadingMaxRetry: 3
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(videoEl);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loadingOverlay.style.display = 'none';
          if (resumeTime > 5) {
            videoEl.currentTime = resumeTime;
          }
          if (autoPlay) {
            videoEl.play().catch(() => {});
          }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('Network error encountered, trying recovery...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('Media error encountered, trying recovery...');
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                showPlayerError('當前線路無法播放該視頻源，請點擊下方其他線路切換！');
                break;
            }
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari / iOS support
        videoEl.src = streamUrl;
        videoEl.addEventListener('loadedmetadata', () => {
          loadingOverlay.style.display = 'none';
          if (resumeTime > 5) {
            videoEl.currentTime = resumeTime;
          }
          if (autoPlay) {
            videoEl.play().catch(() => {});
          }
        }, { once: true });
      } else {
        // MP4 / regular video
        videoEl.src = streamUrl;
        videoEl.load();
        loadingOverlay.style.display = 'none';
        if (resumeTime > 5) {
          videoEl.currentTime = resumeTime;
        }
        if (autoPlay) {
          videoEl.play().catch(() => {});
        }
      }
    }

    function showPlayerError(msg) {
      loadingOverlay.style.display = 'flex';
      loadingText.innerHTML = `
        <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 8px;">⚠️ 播放提示</div>
        <div>${msg}</div>
        <div style="margin-top: 12px;">
          <button onclick="tryNextLine()" class="btn-primary" style="padding: 5px 12px; font-size: 12px;">自動切換下一條線路</button>
        </div>
      `;
    }

    function tryNextLine() {
      if (!currentVideo.sources || currentVideo.sources.length <= 1) {
        alert('暫無其他備用線路');
        return;
      }
      const nextSrc = (currentSourceIdx + 1) % currentVideo.sources.length;
      playEpisode(nextSrc, currentEpIdx, 0, true);
    }

    function setupPlayerEvents() {
      // Auto save watch progress every 5s
      let lastSave = 0;
      videoEl.addEventListener('timeupdate', () => {
        const now = Date.now();
        if (now - lastSave > 4000 && videoEl.currentTime > 0) {
          lastSave = now;
          const src = currentVideo.sources[currentSourceIdx];
          const ep = src && src.episodes ? src.episodes[currentEpIdx] : null;
          WatchHistory.save(
            currentVideo,
            currentSourceIdx,
            currentEpIdx,
            ep ? ep.name : '',
            videoEl.currentTime,
            videoEl.duration
          );
        }
      });

      // Auto play next episode on end
      videoEl.addEventListener('ended', () => {
        const src = currentVideo.sources[currentSourceIdx];
        if (src && src.episodes && currentEpIdx + 1 < src.episodes.length) {
          playEpisode(currentSourceIdx, currentEpIdx + 1, 0, true);
        }
      });

      videoEl.addEventListener('play', () => {
        const centerOverlay = document.getElementById('centerPlayOverlay');
        if (centerOverlay) centerOverlay.style.display = 'none';
        loadingOverlay.style.display = 'none';
        const prefixEl = document.getElementById('playStatusPrefix');
        if (prefixEl) prefixEl.textContent = '當前正在播放：';
      });

      videoEl.addEventListener('pause', () => {
        if (videoEl.currentTime < videoEl.duration && loadingOverlay.style.display !== 'flex') {
          const centerOverlay = document.getElementById('centerPlayOverlay');
          if (centerOverlay) centerOverlay.style.display = 'flex';
        }
      });

      videoEl.addEventListener('playing', () => {
        loadingOverlay.style.display = 'none';
      });

      videoEl.addEventListener('waiting', () => {
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = '緩衝中...';
      });
    }

    function copyShareLink() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          alert('本片播放連結已複製到剪貼板！');
        });
      } else {
        prompt('請複製以下連結：', url);
      }
    }
  </script>
</body>
</html>
