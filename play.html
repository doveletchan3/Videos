<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>正在播放 - 影片串流媒體</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <!-- Hls.js for smooth .m3u8 streaming across all browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>

  <!-- Top Header with Logo and Search -->
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <a href="index.html" class="brand-logo" title="返回首頁"></a>
        <div class="search-box-wrap">
          <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="請輸入影片、短劇、演職人員" autocomplete="off">
            <button type="submit" class="search-btn">搜索</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub Navigation Bar -->
  <nav class="sub-nav">
    <div class="container">
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="index.html?cat=電影">電影</a></li>
        <li><a href="index.html?cat=劇集">劇集</a></li>
        <li class="nav-right">
          <a href="history.html" class="nav-history-link">播放歷史</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Play Area -->
  <main class="container">

    <!-- Video Player Container (16:9) -->
    <div class="player-wrapper" id="playerWrapper" tabindex="0" title="遙控器按 OK 鍵播放/暫停，左右鍵快進/快退 10 秒，雙擊 OK 或按菜單鍵全螢幕">
      <video id="mainVideoPlayer" controls playsinline preload="metadata"></video>
      <div id="tvSeekToast" class="tv-player-toast"></div>
      <div class="player-top-floating-bar">
        <button id="playerFloatBrightnessBtn" onclick="cycleBrightness(event)" class="player-float-btn" title="循環調整畫面亮度 (遙控器按 B 鍵切換)" tabindex="0" role="button">
          🔆 <span id="floatBrightnessText">亮度 100%</span>
        </button>
        <button id="playerFloatFsBtn" onclick="toggleFullScreen(event)" class="player-float-btn" title="切換全螢幕 (遙控器雙擊OK或按菜單鍵)" tabindex="0" role="button">
          ⛶ 全螢幕
        </button>
      </div>
      <div id="playerLoading" class="player-loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <div id="loadingText">視頻加載中，請稍候...</div>
      </div>
      <!-- Center Play Button Overlay -->
      <div id="centerPlayOverlay" class="center-play-overlay" onclick="startPlaybackFromCenterBtn()" title="點擊播放" tabindex="0" role="button">
        <div class="center-play-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="center-play-text">點擊播放</div>
      </div>
    </div>

    <!-- Playback Details and Episode List -->
    <div class="play-detail-layout">
      
      <!-- Left Column: Title, Route Selection, Episodes -->
      <div class="play-left">
        <h1 id="videoTitle" class="video-heading">加載中...</h1>
        
        <div class="line-info-bar">
          <span class="line-info-title">線路選擇</span>
          <span id="lineCountStat" class="line-info-count"></span>
          <button id="retestAllBtn" onclick="testAllSourcesSpeed()" class="btn-secondary" style="padding: 2px 10px; font-size: 12px; margin-left: 10px; cursor: pointer; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;">
            ⚡ 重新測速
          </button>
        </div>
        
        <p class="line-disclaimer">
          (線路利用網路爬蟲技術獲取，各線路的版本、清晰度、播放速度等存在差異請自行切換。建議避開晚上高峯時段。)
        </p>

        <!-- Current Playing Status Badge & Brightness Tuning -->
        <div id="currentPlayStatus" style="margin-bottom: 14px; font-size: 13px; color: #555; background: #f0f7ff; padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
          <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
            <div><span id="playStatusPrefix">當前已選分集：</span><strong id="playingEpLabel" style="color: var(--primary-color);">-</strong></div>
            <span id="historyResumeBadge" style="display: none; background: #ecfdf5; color: #059669; font-weight: bold; padding: 2px 8px; border-radius: 4px; border: 1px solid #a7f3d0; font-size: 12px;"></span>
            <button id="fullScreenBtn" onclick="toggleFullScreen(event)" class="btn-primary" style="padding: 2px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border: none; margin-left: 4px;" title="切換全螢幕 (遙控器按兩下 OK 或按菜單鍵)">⛶ 全螢幕</button>
          </div>

          <!-- Video Brightness Toolbar -->
          <div class="brightness-toolbar" title="視頻畫面過暗時可調高亮度">
            <span class="brightness-label">🔆 畫面亮度</span>
            <button type="button" onclick="adjustBrightness(-10)" class="brightness-btn-step" title="調暗 10%" tabindex="0">-</button>
            <span id="brightnessValueText" class="brightness-val">100%</span>
            <button type="button" onclick="adjustBrightness(10)" class="brightness-btn-step" title="增亮 10%" tabindex="0">+</button>
            <div class="brightness-preset-group">
              <button type="button" onclick="setBrightness(100)" class="brightness-btn-preset active" data-b="100" tabindex="0">標準</button>
              <button type="button" onclick="setBrightness(125)" class="brightness-btn-preset" data-b="125" tabindex="0">微亮</button>
              <button type="button" onclick="setBrightness(150)" class="brightness-btn-preset" data-b="150" tabindex="0">高亮</button>
              <button type="button" onclick="setBrightness(180)" class="brightness-btn-preset" data-b="180" tabindex="0">超亮</button>
            </div>
          </div>
        </div>

        <!-- Sources and Episode Buttons Container -->
        <div id="sourcesContainer">
          <!-- Dynamically populated sources -->
        </div>
      </div>

      <!-- Right Column: Video Info Card matching Image 2 -->
      <div class="play-right">
        <div class="media-info-card">
          <div class="media-info-inner">
            <img id="detailPoster" class="media-info-poster" src="" alt="海報" referrerpolicy="no-referrer" onerror="this.src=APP_CONFIG.DEFAULT_FALLBACK_POSTER">
            <div class="media-info-text">
              <h2 id="detailTitle" class="media-info-title">-</h2>
              <div id="detailAlias" class="media-info-alias">-</div>
              <div class="media-meta-row"><strong>類型：</strong><span id="detailCategory">-</span></div>
              <div class="media-meta-row"><strong>年份：</strong><span id="detailYear">-</span></div>
              <div class="media-meta-row"><strong>地區：</strong><span id="detailRegion">-</span></div>
              <div class="media-meta-row"><strong>主演：</strong><span id="detailActors">-</span></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentVideo = null;
    let currentSourceIdx = 0;
    let currentEpIdx = 0;
    let hls = null;
    const videoEl = document.getElementById('mainVideoPlayer');
    const loadingOverlay = document.getElementById('playerLoading');
    const loadingText = document.getElementById('loadingText');

    document.addEventListener('DOMContentLoaded', async () => {
      initCommonHeader('play');

      const videoId = getUrlParam('id');
      if (!videoId) {
        alert('未指定影片ID，將返回首頁');
        window.location.href = 'index.html';
        return;
      }

      const allVideos = await loadVideos();
      currentVideo = allVideos.find(v => String(v.id) === String(videoId));

      if (!currentVideo) {
        // Check if demo or fallback can be used
        if (videoId === '898899') {
          // Provide demo video
          currentVideo = {
            id: "898899",
            title: "愛你",
            poster: "https://img2.doubanio.com/view/photo/m_ratio_poster/public/p2918554091.jpg",
            category: "劇集",
            details: {
              alias: "愛你，是我做過最好的事,愛上你是我做過最好的事",
              year: "2025",
              region: "中國大陸",
              actors: "車亮逸/張凌赫,徐若晗,王宥鈞,唐九洲,黃燦燦"
            },
            sources: [
              {
                name: "線路1 (穩定秒播)",
                episodes: [
                  { name: "第1集", url: "https://play.xluuss.com/play/7e52BRqa/index.m3u8" },
                  { name: "第2集", url: "https://play.xluuss.com/play/negwR2Ze/index.m3u8" },
                  { name: "第3集", url: "https://play.xluuss.com/play/bo2YjNka/index.m3u8" },
                  { name: "第4集", url: "https://play.xluuss.com/play/rb231MGe/index.m3u8" },
                  { name: "第5集", url: "https://play.xluuss.com/play/rb231Mde/index.m3u8" },
                  { name: "第6集", url: "https://play.xluuss.com/play/rb2314Le/index.m3u8" },
                  { name: "第7集", url: "https://play.xluuss.com/play/vbm3x3qd/index.m3u8" },
                  { name: "第8集", url: "https://play.xluuss.com/play/negwrPje/index.m3u8" }
                ]
              },
              {
                name: "線路2 (備用極速)",
                episodes: [
                  { name: "第1集", url: "https://v.gsuus.com/play/Rb41Azgd/index.m3u8" },
                  { name: "第2集", url: "https://v.gsuus.com/play/dJ6ZvXDd/index.m3u8" },
                  { name: "第3集", url: "https://v.gsuus.com/play/xe7Z6O1b/index.m3u8" },
                  { name: "第4集", url: "https://v.gsuus.com/play/6dBRoVva/index.m3u8" }
                ]
              }
            ]
          };
        } else {
          alert('找不到該影片信息！');
          window.location.href = 'index.html';
          return;
        }
      }

      initPageInfo();
      renderSourcesAndEpisodes();

      // Check if user specified ep or source in query or history
      const historyItem = WatchHistory.get(currentVideo.id);
      const paramSource = getUrlParam('src');
      const paramEp = getUrlParam('ep');
      const paramTime = parseFloat(getUrlParam('t') || '0');

      let targetSrc = 0;
      let targetEp = 0;
      let resumeTime = 0;

      if (historyItem) {
        // 1. Resolve source index from history
        let foundSrcIdx = -1;
        if (typeof historyItem.sourceIndex === 'number' && currentVideo.sources[historyItem.sourceIndex]) {
          foundSrcIdx = historyItem.sourceIndex;
        }
        if (foundSrcIdx === -1 && historyItem.sourceName) {
          foundSrcIdx = currentVideo.sources.findIndex(s => {
            return s.name === historyItem.sourceName ||
                   (s.name && historyItem.sourceName.includes(s.name)) ||
                   (historyItem.sourceRealIndex && s.source_index === historyItem.sourceRealIndex);
          });
        }
        if (foundSrcIdx === -1 && typeof historyItem.sourceRealIndex === 'number') {
          foundSrcIdx = currentVideo.sources.findIndex(s => s.source_index === historyItem.sourceRealIndex);
        }
        if (foundSrcIdx !== -1) {
          targetSrc = foundSrcIdx;
        }

        // 2. Resolve episode index
        if (typeof historyItem.epIndex === 'number') {
          targetEp = historyItem.epIndex;
        }

        // 3. Resolve resume time
        if (typeof historyItem.currentTime === 'number' && historyItem.currentTime > 5) {
          resumeTime = historyItem.currentTime;
        }
      }

      // Explicit URL query params take precedence if present
      if (paramSource !== null && !isNaN(parseInt(paramSource, 10))) {
        const pSrc = parseInt(paramSource, 10);
        if (currentVideo.sources[pSrc]) targetSrc = pSrc;
      }
      if (paramEp !== null && !isNaN(parseInt(paramEp, 10))) {
        targetEp = parseInt(paramEp, 10);
      }
      if (paramTime > 5) {
        resumeTime = paramTime;
      }

      // Update UI hints if resuming from previous history
      const historyBadge = document.getElementById('historyResumeBadge');
      const centerText = document.querySelector('.center-play-text');
      if (resumeTime > 5) {
        const timeStr = formatTime(resumeTime);
        const durStr = (historyItem && historyItem.duration > 0) ? ` / ${formatTime(historyItem.duration)}` : '';
        if (historyBadge) {
          historyBadge.style.display = 'inline-block';
          historyBadge.textContent = `📍 已定位至上次觀看進度：${timeStr}${durStr}`;
        }
        if (centerText) {
          centerText.innerHTML = `繼續播放<div style="font-size: 12px; margin-top: 4px; opacity: 0.9; font-weight: normal;">上次進度：${timeStr}${durStr}</div>`;
        }
      } else {
        if (historyBadge) historyBadge.style.display = 'none';
        if (centerText) centerText.textContent = '點擊播放';
      }

      // Initial page entry: load episode and prepare player at the exact watched position
      playEpisode(targetSrc, targetEp, resumeTime, false);
      setupPlayerEvents();
      initVideoBrightness();

      // Ensure video player is positioned at the top of the screen on page entry
      scrollVideoToTop(false);
      setTimeout(() => scrollVideoToTop(false), 60);
      setTimeout(() => scrollVideoToTop(false), 200);
    });

    function scrollVideoToTop(smooth = true) {
      const player = document.querySelector('.player-wrapper');
      if (player) {
        const rect = player.getBoundingClientRect();
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        // Provide a comfortable breathing margin (14px) between the player and the top of screen
        const topMargin = 14;
        const targetTop = Math.max(0, rect.top + scrollTop - topMargin);
        window.scrollTo({
          top: targetTop,
          behavior: smooth ? 'smooth' : 'auto'
        });
      }
    }

    function initPageInfo() {
      document.title = `${currentVideo.title} - 在線觀看`;
      document.getElementById('videoTitle').textContent = currentVideo.title;
      
      const count = currentVideo.sources ? currentVideo.sources.length : 0;
      document.getElementById('lineCountStat').textContent = `（共${count}條）`;

      // Set poster on video player
      if (currentVideo.poster) {
        videoEl.poster = currentVideo.poster;
      }

      // Details
      document.getElementById('detailTitle').textContent = currentVideo.title;
      document.getElementById('detailPoster').src = currentVideo.poster || APP_CONFIG.DEFAULT_FALLBACK_POSTER;
      
      const d = currentVideo.details || {};
      document.getElementById('detailAlias').textContent = d.alias || currentVideo.title;
      document.getElementById('detailYear').textContent = d.year || '未知';
      document.getElementById('detailRegion').textContent = d.region || '其他';
      document.getElementById('detailActors').textContent = d.actors || '其他';
    }

    function getVideoDefaultLang(video) {
      const reg = (video && video.details && video.details.region) || '';
      const sub = (video && video.subcategory) || '';
      if (reg.includes('港') || sub === '港劇') return '粵語';
      if (reg.includes('日') || sub === '日劇' || sub === '日本動畫') return '日語';
      if (reg.includes('韓') || sub === '韓劇') return '韓語';
      if (reg.includes('美') || reg.includes('英') || sub === '美劇' || sub === '英劇') return 'English';
      return '普通話';
    }

    function renderSourcesAndEpisodes() {
      const container = document.getElementById('sourcesContainer');
      container.innerHTML = '';

      if (!currentVideo.sources || currentVideo.sources.length === 0) {
        container.innerHTML = '<div style="color: #999; padding: 20px;">暫無可播放的線路，請在管理後臺重新配置</div>';
        return;
      }

      currentVideo.sources.forEach((source, sIdx) => {
        const sec = document.createElement('div');
        sec.className = 'source-section';
        sec.id = `source-sec-${sIdx}`;

        const header = document.createElement('div');
        header.className = 'source-header';

        const lineName = source.name || ('線路' + (sIdx + 1));
        const defaultLang = getVideoDefaultLang(currentVideo);
        const langVal = source.lang || defaultLang;
        const epCount = source.episodes ? source.episodes.length : 0;

        header.innerHTML = `
          <div class="source-title">
            <span>${lineName} (${langVal}) (${epCount} 集)</span>
            <span id="speed-badge-${sIdx}" class="speed-badge testing" title="點擊重新測速" tabindex="0" role="button" onclick="testSingleSourceSpeed(${sIdx})">
              <span class="speed-dot"></span><span class="speed-val">測速中...</span>
            </span>
          </div>
        `;
        sec.appendChild(header);

        const epGrid = document.createElement('div');
        epGrid.className = 'episode-grid';

        if (source.episodes && source.episodes.length > 0) {
          source.episodes.forEach((ep, eIdx) => {
            const btn = document.createElement('div');
            btn.className = 'episode-btn';
            btn.id = `ep-btn-${sIdx}-${eIdx}`;
            btn.textContent = ep.name || `第${eIdx + 1}集`;
            btn.title = ep.name;
            btn.setAttribute('tabindex', '0');
            btn.setAttribute('role', 'button');
            btn.onclick = () => {
              const isCurrent = (sIdx === currentSourceIdx && eIdx === currentEpIdx);
              let targetResume = 0;
              if (isCurrent) {
                if (videoEl && videoEl.currentTime > 5) {
                  targetResume = videoEl.currentTime;
                } else if (pendingResumeTime > 5) {
                  targetResume = pendingResumeTime;
                }
              }
              playEpisode(sIdx, eIdx, targetResume, true);
              const playerWrap = document.getElementById('playerWrapper');
              if (playerWrap && typeof TvSpatialNav !== 'undefined') {
                TvSpatialNav.focusElement(playerWrap);
              }
            };
            epGrid.appendChild(btn);
          });
        } else {
          epGrid.innerHTML = '<span style="color: #999; font-size: 12px;">該線路暫無集數</span>';
        }

        sec.appendChild(epGrid);
        container.appendChild(sec);
      });

      // Automatically test network latency for all sources
      testAllSourcesSpeed();

      // Auto-focus center play button or player wrapper for instant remote readiness (NOT the episode button!)
      setTimeout(() => {
        const centerBtn = document.getElementById('centerPlayOverlay');
        const playerWrap = document.getElementById('playerWrapper');
        const target = (centerBtn && centerBtn.style.display !== 'none') ? centerBtn : playerWrap;
        if (target && typeof TvSpatialNav !== 'undefined') {
          TvSpatialNav.focusElement(target);
        }
      }, 180);
    }

    async function measureStreamLatency(url) {
      if (!url) return { success: false };

      // 1. If running locally with server.py, /api/test-line provides immediate server-side check
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        try {
          const apiRes = await fetch('/api/test-line', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });
          if (apiRes.ok) {
            const data = await apiRes.json();
            if (data.success && typeof data.latency === 'number') {
              return { success: true, latency: data.latency };
            }
          }
        } catch (apiErr) {
          // Fall through to client-side test
        }
      }

      // 2. Client-side latency test (directly tests user's connection to the video CDN)
      const t0 = performance.now();
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 4000);
        const resp = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          signal: controller.signal
        });
        clearTimeout(timer);
        const latency = Math.max(1, Math.round(performance.now() - t0));
        if (resp.ok || resp.type === 'opaque') {
          return { success: true, latency };
        }
      } catch (clientErr) {
        // Fallback with no-cors HEAD/GET probe
        try {
          const t1 = performance.now();
          const controller2 = new AbortController();
          const timer2 = setTimeout(() => controller2.abort(), 3500);
          await fetch(url, {
            method: 'HEAD',
            mode: 'no-cors',
            cache: 'no-cache',
            signal: controller2.signal
          });
          clearTimeout(timer2);
          const latency = Math.max(1, Math.round(performance.now() - t1));
          return { success: true, latency };
        } catch (e2) {}
      }
      return { success: false };
    }

    async function testSingleSourceSpeed(sIdx) {
      if (!currentVideo || !currentVideo.sources || !currentVideo.sources[sIdx]) return;
      const source = currentVideo.sources[sIdx];
      const badge = document.getElementById(`speed-badge-${sIdx}`);
      if (!badge) return;

      const ep0 = source.episodes && source.episodes[0] ? source.episodes[0].url : '';
      if (!ep0) {
        badge.className = 'speed-badge error';
        badge.innerHTML = '<span class="speed-dot"></span><span class="speed-val">無分集</span>';
        return;
      }

      badge.className = 'speed-badge testing';
      badge.innerHTML = '<span class="speed-dot"></span><span class="speed-val">測速中...</span>';

      const res = await measureStreamLatency(ep0);
      if (res.success) {
        const ms = res.latency;
        let speedClass = 'fast';
        if (ms > 900) {
          speedClass = 'slow';
        } else if (ms > 450) {
          speedClass = 'medium';
        }
        badge.className = `speed-badge ${speedClass}`;
        badge.innerHTML = `<span class="speed-dot"></span><span class="speed-val">${ms}ms</span>`;
      } else {
        badge.className = 'speed-badge error';
        badge.innerHTML = '<span class="speed-dot"></span><span class="speed-val">超時</span>';
      }
    }

    async function testAllSourcesSpeed() {
      if (!currentVideo || !currentVideo.sources) return;
      const retestBtn = document.getElementById('retestAllBtn');
      if (retestBtn) retestBtn.textContent = '⏳ 測速中...';

      await Promise.all(currentVideo.sources.map((_, idx) => testSingleSourceSpeed(idx)));

      if (retestBtn) retestBtn.textContent = '⚡ 重新測速';
    }

    let pendingResumeTime = 0;
    let hasAppliedResume = false;

    function playEpisode(sIdx, eIdx, resumeTime = 0, autoPlay = true) {
      if (!currentVideo.sources || !currentVideo.sources[sIdx]) return;
      const source = currentVideo.sources[sIdx];
      if (!source.episodes || !source.episodes[eIdx]) return;

      currentSourceIdx = sIdx;
      currentEpIdx = eIdx;
      pendingResumeTime = resumeTime;
      hasAppliedResume = false;
      const ep = source.episodes[eIdx];

      // Update UI active buttons
      document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`ep-btn-${sIdx}-${eIdx}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }

      const lineName = source.name || ('線路' + (sIdx + 1));
      const defaultLang = getVideoDefaultLang(currentVideo);
      const langVal = source.lang || defaultLang;
      const epLabel = `${lineName} (${langVal}) - ${ep.name}`;
      document.getElementById('playingEpLabel').textContent = epLabel;

      const centerOverlay = document.getElementById('centerPlayOverlay');
      const prefixEl = document.getElementById('playStatusPrefix');

      if (autoPlay) {
        if (centerOverlay) centerOverlay.style.display = 'none';
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = `正在連接 ${epLabel}...`;
        if (prefixEl) prefixEl.textContent = '當前正在播放：';
        // When changing episode, smoothly scroll video window to top of screen
        scrollVideoToTop(true);
      } else {
        loadingOverlay.style.display = 'none';
        if (centerOverlay) centerOverlay.style.display = 'flex';
        if (prefixEl) prefixEl.textContent = '當前已選分集：';
        scrollVideoToTop(false);
      }

      loadStreamUrl(ep.url, resumeTime, autoPlay);
    }

    function startPlaybackFromCenterBtn() {
      const centerOverlay = document.getElementById('centerPlayOverlay');
      if (centerOverlay) centerOverlay.style.display = 'none';
      const prefixEl = document.getElementById('playStatusPrefix');
      if (prefixEl) prefixEl.textContent = '當前正在播放：';
      scrollVideoToTop(true);

      const toResume = pendingResumeTime;
      pendingResumeTime = 0; // Clear immediately so subsequent unpauses never jump back!
      hasAppliedResume = true;

      if (toResume > 5) {
        try {
          videoEl.currentTime = toResume;
        } catch (e) {}
        showTvToast(`⏱️ 繼續播放：${formatTime(toResume)}`);
      }

      // Enter full screen only on Android TV / TV Remote environment, never force on Windows desktop!
      if (typeof isTvEnvironment === 'function' && isTvEnvironment()) {
        enterFullScreen();
      }

      const playerWrap = document.getElementById('playerWrapper');
      if (playerWrap && typeof TvSpatialNav !== 'undefined') {
        TvSpatialNav.focusElement(playerWrap);
      }

      videoEl.play().catch((err) => {
        console.warn('Play error:', err);
      });
    }

    function loadStreamUrl(streamUrl, resumeTime = 0, autoPlay = true) {
      if (!streamUrl) {
        showPlayerError('視頻連結爲空，請切換其他集數或線路');
        return;
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const isM3u8 = streamUrl.toLowerCase().includes('.m3u8');

      if (isM3u8 && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          manifestLoadingTimeOut: 12000,
          manifestLoadingMaxRetry: 3,
          startPosition: resumeTime > 5 ? resumeTime : -1
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(videoEl);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loadingOverlay.style.display = 'none';
          if (resumeTime > 5) {
            try {
              videoEl.currentTime = resumeTime;
            } catch (e) {}
            showTvToast(`⏱️ 已跳轉至上次進度：${formatTime(resumeTime)}`);
          }
          if (autoPlay) {
            videoEl.play().catch(() => {});
          }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('Network error encountered, trying recovery...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('Media error encountered, trying recovery...');
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                showPlayerError('當前線路無法播放該視頻源，請點擊下方其他線路切換！');
                break;
            }
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari / iOS support
        videoEl.src = streamUrl;
        videoEl.addEventListener('loadedmetadata', () => {
          loadingOverlay.style.display = 'none';
          if (resumeTime > 5) {
            try {
              videoEl.currentTime = resumeTime;
            } catch (e) {}
            showTvToast(`⏱️ 已跳轉至上次進度：${formatTime(resumeTime)}`);
          }
          if (autoPlay) {
            videoEl.play().catch(() => {});
          }
        }, { once: true });
      } else {
        // MP4 / regular video
        videoEl.src = streamUrl;
        videoEl.load();
        videoEl.addEventListener('loadedmetadata', () => {
          loadingOverlay.style.display = 'none';
          if (resumeTime > 5) {
            try {
              videoEl.currentTime = resumeTime;
            } catch (e) {}
            showTvToast(`⏱️ 已跳轉至上次進度：${formatTime(resumeTime)}`);
          }
          if (autoPlay) {
            videoEl.play().catch(() => {});
          }
        }, { once: true });
      }
    }

    function showPlayerError(msg) {
      loadingOverlay.style.display = 'flex';
      loadingText.innerHTML = `
        <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 8px;">⚠️ 播放提示</div>
        <div>${msg}</div>
        <div style="margin-top: 12px;">
          <button onclick="tryNextLine()" class="btn-primary" style="padding: 5px 12px; font-size: 12px;">自動切換下一條線路</button>
        </div>
      `;
    }

    function tryNextLine() {
      if (!currentVideo.sources || currentVideo.sources.length <= 1) {
        alert('暫無其他備用線路');
        return;
      }
      const nextSrc = (currentSourceIdx + 1) % currentVideo.sources.length;
      playEpisode(nextSrc, currentEpIdx, 0, true);
    }

    function setupPlayerEvents() {
      // Auto save watch progress every 5s (only after past 3s to avoid overwriting on init)
      let lastSave = 0;
      videoEl.addEventListener('timeupdate', () => {
        const now = Date.now();
        if (now - lastSave > 4000 && videoEl.currentTime > 3) {
          lastSave = now;
          const src = currentVideo.sources[currentSourceIdx];
          const ep = src && src.episodes ? src.episodes[currentEpIdx] : null;
          WatchHistory.save(
            currentVideo,
            currentSourceIdx,
            currentEpIdx,
            ep ? ep.name : '',
            videoEl.currentTime,
            videoEl.duration
          );
        }
      });

      // User manually seeked/scrubbed video timeline -> invalidate initial pending resume time
      videoEl.addEventListener('seeking', () => {
        pendingResumeTime = 0;
        hasAppliedResume = true;
      });

      // Auto play next episode on end
      videoEl.addEventListener('ended', () => {
        const src = currentVideo.sources[currentSourceIdx];
        if (src && src.episodes && currentEpIdx + 1 < src.episodes.length) {
          playEpisode(currentSourceIdx, currentEpIdx + 1, 0, true);
        }
      });

      videoEl.addEventListener('play', () => {
        const centerOverlay = document.getElementById('centerPlayOverlay');
        if (centerOverlay) centerOverlay.style.display = 'none';
        loadingOverlay.style.display = 'none';
        const prefixEl = document.getElementById('playStatusPrefix');
        if (prefixEl) prefixEl.textContent = '當前正在播放：';
      });

      videoEl.addEventListener('pause', () => {
        if (videoEl.currentTime < videoEl.duration && loadingOverlay.style.display !== 'flex') {
          const centerOverlay = document.getElementById('centerPlayOverlay');
          if (centerOverlay) {
            centerOverlay.style.display = 'flex';
            const centerText = document.querySelector('.center-play-text');
            if (centerText) {
              centerText.innerHTML = `暫停中<div style="font-size: 12px; margin-top: 4px; opacity: 0.9; font-weight: normal;">點擊繼續播放 (${formatTime(videoEl.currentTime)})</div>`;
            }
          }
        }
      });

      videoEl.addEventListener('playing', () => {
        loadingOverlay.style.display = 'none';
        if (pendingResumeTime > 5 && !hasAppliedResume) {
          hasAppliedResume = true;
          const target = pendingResumeTime;
          pendingResumeTime = 0;
          if (Math.abs(videoEl.currentTime - target) > 3) {
            try {
              videoEl.currentTime = target;
            } catch (e) {}
          }
          showTvToast(`⏱️ 繼續播放：${formatTime(target)}`);
        }
      });

      videoEl.addEventListener('waiting', () => {
        loadingOverlay.style.display = 'flex';
        loadingText.textContent = '緩衝中...';
      });
    }

    function copyShareLink() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          alert('本片播放連結已複製到剪貼板！');
        });
      } else {
        prompt('請複製以下連結：', url);
      }
    }

    // TV Remote Video Player OSD Toast
    let tvToastTimer = null;
    function showTvToast(html) {
      const toast = document.getElementById('tvSeekToast');
      if (!toast) return;
      toast.innerHTML = html;
      toast.classList.add('show');
      clearTimeout(tvToastTimer);
      tvToastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function togglePlayPause() {
      if (!videoEl) return;
      if (videoEl.paused) {
        videoEl.play().catch(() => {});
        showTvToast('▶️ 繼續播放');
      } else {
        videoEl.pause();
        showTvToast('⏸️ 暫停播放');
      }
    }

    function seekRelative(sec) {
      if (!videoEl || isNaN(videoEl.duration)) return;
      const targetTime = Math.max(0, Math.min(videoEl.duration, videoEl.currentTime + sec));
      videoEl.currentTime = targetTime;
      const icon = sec > 0 ? '⏩ 快進' : '⏪ 快退';
      showTvToast(`${icon} ${Math.abs(sec)}秒 &nbsp;(${formatTime(targetTime)} / ${formatTime(videoEl.duration)})`);
    }

    function adjustVolume(delta) {
      if (!videoEl) return;
      let newVol = Math.max(0, Math.min(1, Math.round((videoEl.volume + delta) * 10) / 10));
      videoEl.volume = newVol;
      videoEl.muted = false;
      const pct = Math.round(newVol * 100);
      const icon = pct === 0 ? '🔇 靜音' : (pct < 50 ? '🔉 音量' : '🔊 音量');
      showTvToast(`${icon}：${pct}%`);
    }

    // Video Brightness Control Engine
    let currentBrightness = 100;
    const BRIGHTNESS_STORAGE_KEY = 'ikan_video_brightness';

    function initVideoBrightness() {
      try {
        const saved = localStorage.getItem(BRIGHTNESS_STORAGE_KEY);
        if (saved && !isNaN(parseInt(saved, 10))) {
          const val = parseInt(saved, 10);
          setBrightness(val, false);
          return;
        }
      } catch (e) {}
      setBrightness(100, false);
    }

    function setBrightness(percent, showToast = true) {
      percent = Math.max(60, Math.min(240, Math.round(percent)));
      currentBrightness = percent;
      try {
        localStorage.setItem(BRIGHTNESS_STORAGE_KEY, String(percent));
      } catch (e) {}

      // Apply CSS filter to video element
      // Slightly boost contrast as brightness goes up to prevent washed-out look
      let contrast = 1.0;
      if (percent > 100) {
        contrast = 1.0 + ((percent - 100) / 100) * 0.12;
      }

      if (videoEl) {
        if (percent === 100) {
          videoEl.style.filter = '';
        } else {
          videoEl.style.filter = `brightness(${percent / 100}) contrast(${contrast.toFixed(3)})`;
        }
      }

      // Update UI displays
      const valText = document.getElementById('brightnessValueText');
      if (valText) valText.textContent = `${percent}%`;

      const floatText = document.getElementById('floatBrightnessText');
      if (floatText) floatText.textContent = `亮度 ${percent}%`;

      document.querySelectorAll('.brightness-btn-preset').forEach(btn => {
        const b = parseInt(btn.getAttribute('data-b'), 10);
        if (b === percent) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (showToast) {
        const mode = percent === 100 ? '標準' : (percent <= 130 ? '微亮' : (percent <= 160 ? '高亮' : '超亮'));
        showTvToast(`🔆 畫面亮度：${percent}% (${mode})`);
      }
    }

    function adjustBrightness(delta) {
      setBrightness(currentBrightness + delta, true);
    }

    const BRIGHTNESS_CYCLE_PRESETS = [100, 125, 150, 180];
    function cycleBrightness(e) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      let nextIdx = 0;
      const idx = BRIGHTNESS_CYCLE_PRESETS.indexOf(currentBrightness);
      if (idx !== -1) {
        nextIdx = (idx + 1) % BRIGHTNESS_CYCLE_PRESETS.length;
      } else {
        const found = BRIGHTNESS_CYCLE_PRESETS.find(b => b > currentBrightness);
        nextIdx = found ? BRIGHTNESS_CYCLE_PRESETS.indexOf(found) : 0;
      }
      setBrightness(BRIGHTNESS_CYCLE_PRESETS[nextIdx], true);
    }

    // Fullscreen Enter / Exit Helpers
    function enterFullScreen() {
      const player = document.getElementById('playerWrapper') || videoEl;
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (!isFs && player) {
        const req = player.requestFullscreen || player.webkitRequestFullscreen || player.mozRequestFullScreen || player.msRequestFullscreen;
        if (req) {
          req.call(player).catch(() => {
            if (videoEl.requestFullscreen) videoEl.requestFullscreen().catch(() => {});
            else if (videoEl.webkitEnterFullscreen) videoEl.webkitEnterFullscreen();
          });
        } else if (videoEl.webkitEnterFullscreen) {
          videoEl.webkitEnterFullscreen();
        }
        showTvToast('⛶ 進入全螢幕');
        updateFsButtonState(true);
      }
    }

    function toggleFullScreen(e) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      const player = document.getElementById('playerWrapper') || videoEl;
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

      if (!isFs) {
        enterFullScreen();
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (exit) {
          exit.call(document).catch(() => {});
        }
        showTvToast('🗗 退出全螢幕');
        updateFsButtonState(false);
      }
    }

    function updateFsButtonState(isFs) {
      const fsBtns = [document.getElementById('fullScreenBtn'), document.getElementById('playerFloatFsBtn')];
      fsBtns.forEach(btn => {
        if (btn) {
          btn.innerHTML = isFs ? '🗗 退出全螢幕' : '⛶ 全螢幕';
        }
      });
    }

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      updateFsButtonState(isFs);
    });
    document.addEventListener('webkitfullscreenchange', () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      updateFsButtonState(isFs);
    });

    // Double-click on player to toggle fullscreen
    const playerWrapEl = document.getElementById('playerWrapper');
    if (playerWrapEl) {
      playerWrapEl.addEventListener('dblclick', toggleFullScreen);
    }
    if (videoEl) {
      videoEl.addEventListener('dblclick', toggleFullScreen);
    }

    let lastOkPressTime = 0;

    // Android TV Remote Control Hook for Video Player
    window.handleTvPlayerKey = function({
      isUp, isDown, isLeft, isRight, isEnter, isBack,
      isMediaPlayPause, isMediaFastForward, isMediaRewind,
      e
    }) {
      const playerWrapper = document.getElementById('playerWrapper');
      const centerOverlay = document.getElementById('centerPlayOverlay');
      const isCenterVisible = centerOverlay && centerOverlay.style.display !== 'none';
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      const isFocusedOnPlayer = (document.activeElement === playerWrapper || document.activeElement === videoEl);
      const isFocusedOnCenter = (document.activeElement === centerOverlay);
      const isFocusedOnEpBtn = document.activeElement && document.activeElement.classList.contains('episode-btn');

      // Remote shortcut keys for Fullscreen: F key (70) or Menu key (82) or ContextMenu
      const code = e ? (e.keyCode || e.which) : 0;
      const key = e ? e.key : '';
      if (key === 'f' || key === 'F' || code === 70 || code === 82 || key === 'ContextMenu') {
        toggleFullScreen();
        return true;
      }

      // Shortcut key 'B' / 'b' (code 66 / 98) to adjust/cycle brightness
      if (key === 'b' || key === 'B' || code === 66 && !isEnter) {
        cycleBrightness();
        return true;
      }

      // Hardware Media Keys
      if (isMediaPlayPause) {
        togglePlayPause();
        return true;
      }
      if (isMediaFastForward) {
        seekRelative(10);
        return true;
      }
      if (isMediaRewind) {
        seekRelative(-10);
        return true;
      }

      // ==========================================
      // Scenario 1: Video is in Full Screen Mode
      // (100% of TV D-pad keys are dedicated to playback)
      // ==========================================
      if (isFs) {
        if (isBack) {
          toggleFullScreen();
          return true;
        }
        if (isEnter) {
          const now = Date.now();
          if (now - lastOkPressTime < 450) {
            // Double-click OK: Toggle Fullscreen
            lastOkPressTime = 0;
            toggleFullScreen();
            return true;
          }
          lastOkPressTime = now;
          togglePlayPause();
          return true;
        }
        if (isLeft) {
          seekRelative(-10);
          return true;
        }
        if (isRight) {
          seekRelative(10);
          return true;
        }
        if (isUp) {
          adjustVolume(0.1);
          return true;
        }
        if (isDown) {
          adjustVolume(-0.1);
          return true;
        }
        return true; // Absorb any other keys in fullscreen
      }

      // ==========================================
      // Scenario 2: Center Play Overlay is Focused
      // ==========================================
      if (isFocusedOnCenter) {
        if (isEnter) {
          startPlaybackFromCenterBtn();
          return true;
        }
        if (isDown) {
          const activeEp = document.querySelector('.episode-btn.active') || document.querySelector('.episode-btn');
          if (activeEp && typeof TvSpatialNav !== 'undefined') {
            TvSpatialNav.focusElement(activeEp);
            return true;
          }
        }
      }

      // ==========================================
      // Scenario 3: Player Wrapper is Focused
      // ==========================================
      if (isFocusedOnPlayer) {
        if (isEnter) {
          if (isCenterVisible) {
            startPlaybackFromCenterBtn();
            return true;
          }
          const now = Date.now();
          if (now - lastOkPressTime < 450) {
            // Double-click OK: Enter Fullscreen!
            lastOkPressTime = 0;
            toggleFullScreen();
            return true;
          }
          lastOkPressTime = now;
          togglePlayPause();
          return true;
        }
        if (isLeft) {
          seekRelative(-10);
          return true;
        }
        if (isRight) {
          seekRelative(10);
          return true;
        }
        if (isUp) {
          adjustVolume(0.1);
          return true;
        }
        if (isDown) {
          // Move focus down into episode list
          const activeEp = document.querySelector('.episode-btn.active') || document.querySelector('.episode-btn');
          if (activeEp && typeof TvSpatialNav !== 'undefined') {
            TvSpatialNav.focusElement(activeEp);
            return true;
          }
        }
      }

      // ==========================================
      // Scenario 4: Video is actively playing, user presses Left/Right/OK
      // (Focus might be on body or generic element, avoid jumping to EP 02!)
      // ==========================================
      const isVideoPlaying = videoEl && !videoEl.paused;
      if (isVideoPlaying && !isFocusedOnEpBtn) {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag !== 'INPUT' && activeTag !== 'BUTTON') {
          if (isLeft) {
            seekRelative(-10);
            return true;
          }
          if (isRight) {
            seekRelative(10);
            return true;
          }
          if (isEnter) {
            togglePlayPause();
            return true;
          }
          if (isUp) {
            adjustVolume(0.1);
            return true;
          }
          if (isDown) {
            const activeEp = document.querySelector('.episode-btn.active') || document.querySelector('.episode-btn');
            if (activeEp && typeof TvSpatialNav !== 'undefined') {
              TvSpatialNav.focusElement(activeEp);
              return true;
            }
          }
        }
      }

      // ==========================================
      // Scenario 5: User is focused on Episode Grid
      // ==========================================
      if (isFocusedOnEpBtn && isUp) {
        const curRect = document.activeElement.getBoundingClientRect();
        const parentGrid = document.activeElement.closest('.episode-grid');
        if (parentGrid) {
          const firstBtn = parentGrid.querySelector('.episode-btn');
          if (firstBtn && Math.abs(firstBtn.getBoundingClientRect().top - curRect.top) < 24) {
            const target = isCenterVisible ? centerOverlay : playerWrapper;
            if (target && typeof TvSpatialNav !== 'undefined') {
              TvSpatialNav.focusElement(target);
              scrollVideoToTop(true);
              return true;
            }
          }
        }
      }

      return false;
    };
  </script>
</body>
</html>
